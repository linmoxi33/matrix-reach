[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-reach"
version = "0.1.0"
description = "Exact GitHub Actions matrix expansion with mutation-proven reachability audits"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]
license = {text = "MIT"}
authors = [{name = "linmoxi33"}]

[tool.setuptools]
packages = ["matrix_reach"]
